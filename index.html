<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta a Dois</title>
<meta name="theme-color" content="#6d3ad6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4fd; --card:#ffffff; --surface:#faf8ff; --lilac:#f0eafb; --lilac-2:#d9ccf7;
    --purple:#6d3ad6; --purple-dark:#3f1f86; --nav-active:#f1eafc; --nav-ink:#7a4cc4;
    --ink:#241a3d; --muted:#6f6688; --faint:#b3a6c9; --line:#e8e1f5;
    --green:#1c9a4e; --green-dark:#157a3d; --red:#c0354a; --amber:#a66a00;
    --radius:14px; --side:260px;
  }
  *{box-sizing:border-box}
  html{font-size:17px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{margin:0;line-height:1.2}
  svg.ic{flex:none}

  /* ---- topo: seletor de espaço ---- */
  #stickytop{position:sticky;top:0;z-index:30}
  header.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 24px;overflow-x:auto;scrollbar-width:none}
  header.top::-webkit-scrollbar{display:none}
  .burger{display:none;flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;height:42px;cursor:pointer;color:var(--purple-dark);align-items:center;justify-content:center}
  .pill{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:500;white-space:nowrap}
  .pill:hover{background:var(--lilac)}
  .pill[aria-pressed="true"]{background:var(--nav-active);border-color:var(--lilac-2);color:var(--purple-dark);font-weight:700}
  .spacebanner{background:var(--lilac);color:var(--purple-dark);padding:10px 24px;font-size:.92rem;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .spacebanner span{color:var(--muted)}

  /* ---- layout com sidebar ---- */
  .body{display:grid;grid-template-columns:var(--side) 1fr;align-items:stretch}
  aside.side{background:#fff;border-right:1px solid var(--line);padding:22px 20px 18px;display:flex;flex-direction:column;position:sticky;top:var(--stickyH,115px);align-self:start;height:calc(100vh - var(--stickyH,115px));overflow-y:auto}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#7a46e6,#5a25c2);display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(109,58,214,.3)}
  .logo .word{font-size:1.55rem;font-weight:700;color:#2a1660;letter-spacing:-.03em}
  .logo .word i{font-style:normal;font-weight:400;color:#6f5aa8;margin:0 .22em}
  .logo .word b{color:var(--purple);margin-left:1px}
  .navlabel{font-size:.72rem;letter-spacing:.14em;color:var(--faint);font-weight:600;margin:0 0 10px 12px;text-transform:uppercase}
  nav.nav{display:flex;flex-direction:column;gap:4px}
  nav.nav button{display:flex;align-items:center;gap:14px;border:none;background:transparent;color:var(--muted);padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:500;text-align:left;font-size:1rem}
  nav.nav button:hover{background:#f8f5fe}
  nav.nav button[aria-current="page"]{background:var(--nav-active);color:var(--nav-ink);font-weight:700}
  .me{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:12px}
  .me .av{width:36px;height:36px;border-radius:50%;background:var(--lilac);color:var(--purple);display:grid;place-items:center;font-weight:700}
  .me b{display:block;font-size:.95rem}
  .me small{color:var(--muted);font-size:.8rem}
  main.content{padding:26px 28px 80px;min-width:0;max-width:1100px;width:100%}
  .scrim{display:none}

  @media(max-width:900px){
    .burger{display:inline-flex}
    header.top{padding:10px 14px}
    .spacebanner{padding:10px 16px}
    .body{grid-template-columns:1fr}
    aside.side{position:fixed;z-index:40;left:0;top:0;height:100vh;width:280px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(31,22,53,.25)}
    aside.side.open{transform:none}
    .scrim.open{display:block;position:fixed;inset:0;background:rgba(31,22,53,.45);z-index:35}
    main.content{padding:18px 16px 80px}
  }

  /* ---- conteúdo ---- */
  .view-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .view-head h2{font-size:1.6rem;color:var(--purple-dark);letter-spacing:-.02em}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{border:1px solid var(--purple);background:var(--purple);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--purple-dark)}
  .btn.ghost{background:#fff;color:var(--purple)}
  .btn.ghost:hover{background:var(--lilac)}
  .btn.danger{background:#fff;color:var(--red);border-color:#efc3cb}
  .btn.danger:hover{background:#fdeef0}
  .btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.wa{background:var(--green);border-color:var(--green)}
  .btn.wa:hover{background:var(--green-dark)}
  a.btn{text-decoration:none;display:inline-block}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h3{font-size:.95rem;color:var(--muted);font-weight:600;margin-bottom:6px}
  .big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;color:var(--purple-dark)}
  .big.neg{color:var(--red)}
  .sub{color:var(--muted);font-size:.9rem}
  .hero{background:linear-gradient(135deg,#efe7fc,#fff);border:1px solid var(--lilac-2)}
  .section{margin-top:26px}
  .section>h3{font-size:1.1rem;color:var(--purple-dark);margin-bottom:10px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--lilac);color:var(--purple-dark);white-space:nowrap}
  .badge.shared{background:var(--purple);color:#fff}
  .badge.ok{background:#e9f7ee;color:var(--green-dark)}
  .badge.late{background:#fdeef0;color:var(--red)}
  .badge.wait{background:#fff4de;color:var(--amber)}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .row .grow{flex:1 1 220px;min-width:0}
  .row .title{font-weight:650;overflow-wrap:anywhere}
  .row .title.done{text-decoration:line-through;color:var(--muted)}
  .row .amount{font-weight:700;font-size:1.1rem;white-space:nowrap}
  .row .actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{border:1px dashed var(--lilac-2);border-radius:var(--radius);padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface)}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .subtabs button{border:none;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
  .subtabs button[aria-current="true"]{color:var(--purple);border-bottom-color:var(--purple)}

  .sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
  table.sheet{border-collapse:collapse;width:100%;min-width:980px;font-size:.92rem}
  table.sheet th,table.sheet td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:middle;white-space:nowrap}
  table.sheet th{background:var(--lilac);color:var(--purple-dark);position:sticky;top:0;font-weight:700}
  table.sheet tr:nth-child(even) td{background:#fcfbff}
  table.sheet td.num,table.sheet th.num{text-align:right}
  table.sheet tr.dim td{opacity:.55}
  table.sheet .acts{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}

  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--lilac-2);border-radius:9px;background:#fff}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
  .field{margin-bottom:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;margin:0;border:1px solid var(--lilac-2);border-radius:10px;padding:9px 10px;text-align:center;cursor:pointer;font-weight:600;background:#fff}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--purple);border-color:var(--purple);color:#fff}
  .check{display:flex;gap:8px;align-items:center;font-weight:500}
  .check input{width:auto}
  .hint{font-size:.82rem;color:var(--muted);margin-top:3px}
  .error{color:var(--red);font-weight:600;margin:6px 0}
  .overlay{position:fixed;inset:0;background:rgba(31,22,53,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}
  .modal h3{font-size:1.25rem;color:var(--purple-dark);margin-bottom:14px}
  .modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}.modal{border-radius:18px}}
  @media(max-width:480px){.two{grid-template-columns:1fr}html{font-size:16px}}
  .banner{background:#fff4de;color:var(--amber);border:1px solid #f1d9a5;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:.9rem}
  .note{background:var(--lilac);border-radius:10px;padding:10px 14px;font-size:.9rem;color:var(--purple-dark)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-size:.92rem}

  /* gráficos simples (Análises) */
  .hbar{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
  .hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{height:12px;background:var(--lilac);border-radius:999px;overflow:hidden}
  .track>span{display:block;height:100%;background:var(--purple);border-radius:999px}
  .cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
  .col .b{width:100%;max-width:56px;background:var(--lilac-2);border-radius:8px 8px 0 0;min-height:2px}
  .col.cur .b{background:var(--purple)}
  .col small{color:var(--muted);font-size:.75rem}
  .col .v{font-size:.72rem;font-weight:600;color:var(--purple-dark);white-space:nowrap}
</style>
</head>
<body>
<div id="stickytop"><header class="top" id="top"></header>
<div class="spacebanner" id="spaceBanner"></div></div>
<div class="body">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <main class="content" id="app"></main>
</div>
<div class="scrim" id="scrim" data-act="menu-close"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
   Conta a Dois — app de finanças de duas pessoas (arquivo único)
   - Valores sempre em CENTAVOS (inteiros). Nunca float.
   - Dois espaços: PARTICULAR (só do usuário) e CASA (compartilhado, rateio 50/50).
   - Dados no navegador (localStorage). Backup por exportar/importar JSON.
   - Repasse NUNCA é despesa: é registro próprio que abate a pendência.
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthOf = ds => ds.slice(0, 7);
const fmtDate = ds => ds ? ds.split('-').reverse().join('/') : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const monthLabel = m => { const [y, mo] = m.split('-'); return `${MESES[+mo - 1]} de ${y}`; };
const shortMonth = m => MESES[+m.slice(5) - 1].slice(0, 3);
const shiftMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T12:00:00'));
function addMonths(ds, k) {
  const [y, m, d] = ds.split('-').map(Number);
  const t = new Date(y, m - 1 + k, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(d, last))}`;
}
/* "1.234,56" | "12,5" | "12.50" | "100" -> centavos (inteiro) ou null */
function parseMoney(txt) {
  let s = String(txt ?? '').trim().replace(/[^\d.,]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const [i, f = ''] = s.split('.');
  if (!/^\d+$/.test(i || '0') || (f && !/^\d+$/.test(f))) return null;
  let cents = parseInt(i || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  if (f.length > 2 && parseInt(f[2], 10) >= 5) cents += 1;
  return cents;
}
const moneyInput = c => (c / 100).toFixed(2).replace('.', ',');

/* ---------- ícones (traço, estilo lucide) ---------- */
const P = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  wallet: '<path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h14a1 1 0 0 1 1 1v3"/><path d="M3 6v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  tasks: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 12h6M9 16h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chart: '<path d="M3 20h18"/><path d="m5 16 4-5 4 3 6-8"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.5 2.3 3.5 5.2"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>'
};
const icon = (n, s = 22) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- estado e persistência ---------- */
const KEY = 'conta-a-dois:v1';
const DEFAULT_CATS = ['Mercado', 'Casa', 'Contas fixas', 'Transporte', 'Lazer', 'Alimentação fora', 'Saúde', 'Outros'];
const METHODS = ['Cartão de crédito', 'Cartão de débito', 'Pix', 'Dinheiro', 'Outro'];
const freshState = () => ({
  v: 2,
  people: [{ id: 'a', name: 'Marcus' }, { id: 'b', name: 'Mariana' }],
  categories: [...DEFAULT_CATS],
  expenses: [], transfers: [], wallet: [], students: [], payments: [], tasks: []
});
let storageOk = true;
function migrate(d) {
  const s = Object.assign(freshState(), d);
  s.tasks = s.tasks || [];
  /* v1 não tinha espaços: compartilhadas e despesas da pessoa 2 vão para a Casa; o resto é Particular */
  s.expenses.forEach(e => { if (!e.space) e.space = (e.type === 'individual' && e.owner === s.people[0].id) ? 'particular' : 'casa'; });
  s.wallet.forEach(w => { if (!w.space) w.space = 'particular'; });
  s.v = 2;
  return s;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); }
  catch (e) { storageOk = false; }
  return freshState();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }

const ui = { space: 'particular', page: 'visao', cartTab: 'receb', month: todayStr().slice(0, 7), expType: 'todas', expPerson: 'todas', showInactive: false, taskFilter: 'abertas' };
const me = () => S.people[0];
const person = id => S.people.find(p => p.id === id) || { id, name: '—' };
const pname = id => person(id).name;
const other = id => (S.people[0].id === id ? S.people[1].id : S.people[0].id);
const isCasa = () => ui.space === 'casa';
const curMonth = () => ui.month || todayStr().slice(0, 7);
const inSpace = arr => arr.filter(x => x.space === ui.space);
const casaLabel = () => `Casa · ${S.people[1].name}`;

/* ---------- regras financeiras ---------- */
/* Parcelas: valor total dividido de forma determinística; os centavos que sobram vão para as primeiras parcelas. */
function buildParcels(totalCents, n, dateStr, paidMap = {}) {
  const base = Math.floor(totalCents / n), rem = totalCents - base * n;
  return Array.from({ length: n }, (_, i) => {
    const prev = paidMap[i + 1];
    return { n: i + 1, cents: base + (i < rem ? 1 : 0), due: addMonths(dateStr, i), paid: !!(prev && prev.paid), paidDate: prev && prev.paid ? prev.paidDate : '' };
  });
}
/* Rateio 50/50: o centavo ímpar fica com quem pagou (determinístico). */
function splitShared(cents, payerId) {
  const payerShare = Math.ceil(cents / 2);
  return { [payerId]: payerShare, [other(payerId)]: cents - payerShare };
}
/* Saldo de acerto (só CASA): conta PARCELAS PAGAS de despesas compartilhadas (fluxo de caixa).
   net[p] > 0 => p adiantou dinheiro e tem a receber; net[p] < 0 => p deve. Repasses abatem sem tocar nas despesas. */
function balance() {
  const net = { [S.people[0].id]: 0, [S.people[1].id]: 0 };
  const paidBy = { ...net }, shareOf = { ...net };
  let future = 0;
  for (const e of S.expenses) {
    if (e.space !== 'casa' || e.type !== 'shared') continue;
    for (const p of e.parcels) {
      if (!p.paid) { future += p.cents; continue; }
      const sh = splitShared(p.cents, e.payer);
      paidBy[e.payer] += p.cents;
      for (const id in sh) shareOf[id] += sh[id];
    }
  }
  for (const id in net) net[id] = paidBy[id] - shareOf[id];
  for (const t of S.transfers) { net[t.from] += t.cents; net[t.to] -= t.cents; }
  const [a, b] = S.people;
  const owes = net[a.id] > 0 ? { from: b.id, to: a.id, cents: net[a.id] } : net[b.id] > 0 ? { from: a.id, to: b.id, cents: net[b.id] } : null;
  return { net, paidBy, shareOf, owes, future };
}
/* Gasto do mês por vencimento das parcelas, dentro do espaço atual. */
function monthSpend(month) {
  const out = {}; S.people.forEach(p => out[p.id] = { individual: 0, shared: 0 });
  let total = 0;
  for (const e of inSpace(S.expenses)) for (const p of e.parcels) {
    if (monthOf(p.due) !== month) continue;
    total += p.cents;
    if (e.type === 'individual') out[e.owner].individual += p.cents;
    else { const sh = splitShared(p.cents, e.payer); for (const id in sh) out[id].shared += sh[id]; }
  }
  return { out, total };
}
const dueFor = (st, month) => `${month}-${pad(Math.min(st.dueDay, new Date(+month.slice(0, 4), +month.slice(5), 0).getDate()))}`;
function studentStatus(st, month) {
  const pay = S.payments.find(p => p.studentId === st.id && p.month === month);
  if (pay) return { key: 'pago', label: 'Pago', pay };
  const late = dueFor(st, month) < todayStr();
  return { key: late ? 'atrasado' : 'pendente', label: late ? 'Atrasado' : 'Pendente' };
}

/* ---------- UI base ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function openModal(title, bodyHtml, { onSubmit, submitLabel = 'Salvar', cancelLabel = 'Cancelar', hideSubmit = false } = {}) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3><div id="modalBody">${bodyHtml}</div><div class="error" id="modalErr" hidden></div>
    <div class="foot"><button type="button" class="btn ghost" data-close>${esc(cancelLabel)}</button>${hideSubmit ? '' : `<button type="submit" class="btn">${esc(submitLabel)}</button>`}</div></form></div>`;
  const form = $('form.modal', root);
  const close = () => { root.innerHTML = ''; };
  root.querySelector('[data-close]').onclick = close;
  root.querySelector('.overlay').addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) close(); });
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    if (!onSubmit) return close();
    const err = onSubmit(new FormData(form), form);
    if (err) { const el = $('#modalErr', root); el.textContent = err; el.hidden = false; }
    else { close(); save(); render(); }
  });
  const first = form.querySelector('input:not([type=radio]):not([type=hidden]),select,textarea'); if (first) first.focus();
  return { form, close };
}
const optPeople = (sel) => S.people.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
const optList = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
const monthBar = (allowAll) => `<div class="toolbar">

  if (!up.length) return `<div class="empty">Sem parcelas em aberto.</div>`;
  return `<div class="list">${up.slice(0, limit || 999).map(({ e, p }) => `<div class="row"><div class="grow"><div class="title">${esc(e.desc)}</div>
    <div class="sub">Parcela ${p.n}/${e.parcels.length} · vence ${fmtDate(p.due)} · ${esc(pname(e.payer))}</div></div>
    <span class="badge ${p.due < todayStr() ? 'late' : 'wait'}">${p.due < todayStr() ? 'Vencida' : 'A vencer'}</span><div class="amount">${brl(p.cents)}</div>

    <div class="hint">Repasses parciais são aceitos; o saldo restante é recalculado.</div>`;
  openModal('Registrar repasse', html, { onSubmit: fd => {
    const cents = parseMoney(fd.get('val')), date = String(fd.get('date'));
    if (fd.get('from') === fd.get('to')) return 'Quem enviou e quem recebeu devem ser pessoas diferentes.';
    if (!cents || cents <= 0) return 'Informe um valor maior que zero.';
    if (!validDate(date)) return 'Informe uma data válida.';
    S.transfers.push({ id: uid(), from: fd.get('from'), to: fd.get('to'), cents, date, note: String(fd.get('note') || '').trim() });
    return null;
  } });
}

/* ---------- Carteira (recebimentos + alunos no Particular) ---------- */
const WSTATUS = { recebido: ['Recebido', 'ok'], pendente: ['Pendente', 'wait'], previsto: ['Previsto', ''] };
function walletStatus(w) { return w.status !== 'recebido' && w.date < todayStr() ? ['Atrasado', 'late'] : WSTATUS[w.status]; }
function viewCarteira() {
  const tabs = !isCasa() ? `<div class="subtabs" role="tablist"><button data-act="cart-tab" data-tab="receb" aria-current="${ui.cartTab === 'receb'}">Recebimentos</button><button data-act="cart-tab" data-tab="alunos" aria-current="${ui.cartTab === 'alunos'}">Painel de Alunos</button></div>` : '';
  if (!isCasa() && ui.cartTab === 'alunos') return `<div class="view-head"><h2>Carteira</h2><button class="btn" data-act="st-new">+ Novo aluno</button></div>${tabs}${alunosHtml()}`;

  const open = items.filter(w => w.status !== 'recebido').reduce((s, w) => s + w.cents, 0);
  const tuition = !isCasa() ? S.payments.filter(p => p.month === m).reduce((s, p) => s + p.cents, 0) : 0;
  return `<div class="view-head"><h2>Carteira</h2><button class="btn" data-act="w-new">+ Novo recebimento</button></div>${tabs}
  <div style="margin-bottom:14px">${monthBar(false)}</div>
  <div class="grid g3">
    <div class="card hero"><h3>Total recebido</h3><div class="big">${brl(rec + tuition)}</div><div class="sub">${isCasa() ? 'Entradas da casa' : 'Lançamentos + mensalidades'}</div></div>
    <div class="card"><h3>A receber</h3><div class="big">${brl(open)}</div><div class="sub">Previsto e pendente</div></div>
    ${!isCasa() ? `<div class="card"><h3>Mensalidades recebidas</h3><div class="big">${brl(tuition)}</div><div class="sub">Vindo do Painel de Alunos</div></div>` : ''}
  </div>
  <div class="section"><h3>Lançamentos de ${esc(monthLabel(m))}</h3>
  ${items.length ? `<div class="list">${items.map(w => { const [l, c] = walletStatus(w); return `<div class="row"><div class="grow"><div class="title">${esc(w.desc)}</div>
    <div class="sub">${fmtDate(w.date)} · ${w.kind === 'ganho' ? 'Outro ganho' : 'Recebimento'}${w.note ? ' · ' + esc(w.note) : ''}</div></div>
    <span class="badge ${c}">${l}</span><div class="amount">${brl(w.cents)}</div>
    <div class="actions">${w.status !== 'recebido' ? `<button class="btn sm" data-act="w-receive" data-id="${w.id}">Marcar recebido</button>` : ''}
    <button class="btn ghost sm" data-act="w-edit" data-id="${w.id}">Editar</button><button class="btn danger sm" data-act="w-del" data-id="${w.id}">Excluir</button></div></div>`; }).join('')}</div>`
  : `<div class="empty">Nada lançado neste mês.</div>`}</div>`;
}
function walletForm(w) {

    <div class="two"><div class="field"><label for="w_val">Valor (R$)</label><input type="text" inputmode="decimal" id="w_val" name="val" value="${d.cents ? moneyInput(d.cents) : ''}" placeholder="0,00"></div>

/* ---------- Painel de Alunos (dentro da Carteira, só no Particular) ---------- */
function waLink(st, month) {
  let ph = String(st.phone || '').replace(/\D/g, ''); if (!ph) return '';
  if (ph.length <= 11) ph = '55' + ph;
  const s = studentStatus(st, month), first = st.name.trim().split(/\s+/)[0];
  const txt = s.key === 'pago'
    ? `Olá, ${first}! Recebi o pagamento da mensalidade de ${MESES[+month.slice(5) - 1]}. Muito obrigado(a)!`
    : `Olá, ${first}! Tudo bem? Passando para lembrar da mensalidade de ${MESES[+month.slice(5) - 1]} (${brl(st.feeCents)}), com vencimento em ${fmtDate(dueFor(st, month))}. Qualquer dúvida, é só me chamar!`;
  return `https://wa.me/${ph}?text=${encodeURIComponent(txt)}`;
}
function alunosHtml() {
  const m = curMonth();
  const all = S.students.filter(s => ui.showInactive || s.active).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  const act = S.students.filter(s => s.active);
  const expected = act.reduce((s, st) => s + st.feeCents, 0);
  const received = S.payments.filter(p => p.month === m).reduce((s, p) => s + p.cents, 0);
  const lateN = act.filter(s => studentStatus(s, m).key === 'atrasado').length;
  const rows = all.map(st => {
    const s = studentStatus(st, m), link = waLink(st, m);
    const cls = s.key === 'pago' ? 'ok' : s.key === 'atrasado' ? 'late' : 'wait';
    return `<tr class="${st.active ? '' : 'dim'}"><td><b>${esc(st.name)}</b>${st.active ? '' : ' <span class="badge">inativo</span>'}</td><td>${esc(st.phone || '—')}</td>
      <td class="num">${brl(st.feeCents)}</td><td>dia ${st.dueDay}</td>
      <td><span class="badge ${cls}">${s.label}</span>${s.pay ? ` <span class="sub">${brl(s.pay.cents)} em ${fmtDate(s.pay.date)}</span>` : ''}</td>
      <td><div class="acts">${s.key === 'pago' ? `<button class="btn ghost sm" data-act="st-undo" data-id="${st.id}">Desfazer</button>` : `<button class="btn sm" data-act="st-pay" data-id="${st.id}">Receber</button>`}
      ${link ? `<a class="btn wa sm" href="${link}" target="_blank" rel="noopener">Enviar mensagem</a>` : `<button class="btn wa sm" disabled title="Cadastre o WhatsApp do aluno">Enviar mensagem</button>`}
      <button class="btn ghost sm" data-act="st-edit" data-id="${st.id}">Editar</button><button class="btn danger sm" data-act="st-del" data-id="${st.id}">Excluir</button></div></td></tr>`;
  }).join('');
  return `<div class="toolbar" style="margin-bottom:14px">${monthBar(false)}<label class="check" style="margin:0"><input type="checkbox" data-act="st-inactive" ${ui.showInactive ? 'checked' : ''}> Mostrar inativos</label></div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h3>Esperado no mês</h3><div class="big">${brl(expected)}</div></div>
    <div class="card hero"><h3>Recebido</h3><div class="big">${brl(received)}</div></div>
    <div class="card"><h3>Em atraso</h3><div class="big ${lateN ? 'neg' : ''}">${lateN}</div><div class="sub">aluno(s)</div></div></div>
  ${all.length ? `<div class="sheet-wrap"><table class="sheet"><thead><tr><th>Aluno</th><th>WhatsApp</th><th class="num">Mensalidade</th><th>Vence</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div>`
  : `<div class="empty">Nenhum aluno cadastrado.<br><button class="btn" style="margin-top:12px" data-act="st-new">Cadastrar o primeiro aluno</button></div>`}`;
}
function studentForm(st) {
  const d = st || { name: '', phone: '', feeCents: 0, dueDay: 10, note: '', active: true };
  const html = `<div class="field"><label for="s_name">Nome</label><input type="text" id="s_name" name="name" value="${esc(d.name)}" maxlength="80"></div>
    <div class="field"><label for="s_phone">WhatsApp (com DDD)</label><input type="tel" id="s_phone" name="phone" value="${esc(d.phone)}" placeholder="21 99999-9999"></div>
    <div class="two"><div class="field"><label for="s_fee">Mensalidade (R$)</label><input type="text" inputmode="decimal" id="s_fee" name="fee" value="${d.feeCents ? moneyInput(d.feeCents) : ''}" placeholder="0,00"></div>

}
function payForm(st) {
  const m = curMonth();
  openModal(`Receber — ${st.name}`, `<div class="sub" style="margin-bottom:10px">Mensalidade de ${esc(monthLabel(m))}</div>
    <div class="two"><div class="field"><label for="p_val">Valor recebido (R$)</label><input type="text" inputmode="decimal" id="p_val" name="val" value="${moneyInput(st.feeCents)}"></div>
    <div class="field"><label for="p_date">Data</label><input type="date" id="p_date" name="date" value="${todayStr()}"></div></div>
    <div class="field"><label for="p_m">Meio</label><select id="p_m" name="method"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Outro</option></select></div>`,
    { submitLabel: 'Confirmar recebimento', onSubmit: fd => {

}

/* ---------- Tarefas ---------- */
function taskRow(t) {

}

  let list = inSpace(S.tasks);

function taskForm(t) {

    if (t) S.tasks[S.tasks.indexOf(t)] = obj; else S.tasks.push(obj);

}

/* ---------- Análises ---------- */
function viewAnalises() {
  const m = curMonth();
  const exps = inSpace(S.expenses);
  const byMonth = mm => exps.reduce((s, e) => s + e.parcels.filter(p => monthOf(p.due) === mm).reduce((a, p) => a + p.cents, 0), 0);
  const months = Array.from({ length: 6 }, (_, i) => shiftMonth(m, i - 5));
  const vals = months.map(byMonth), max = Math.max(...vals, 1);
  const cats = {};
  exps.forEach(e => e.parcels.forEach(p => { if (monthOf(p.due) === m) cats[e.category] = (cats[e.category] || 0) + p.cents; }));
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]), catMax = catList.length ? catList[0][1] : 1, catTotal = catList.reduce((s, [, v]) => s + v, 0);
  const methods = {};
  exps.forEach(e => e.parcels.forEach(p => { if (monthOf(p.due) === m) methods[e.method] = (methods[e.method] || 0) + p.cents; }));
  const metList = Object.entries(methods).sort((a, b) => b[1] - a[1]);
  const bar = ([l, v], mx) => `<div class="hbar"><span class="lbl" title="${esc(l)}">${esc(l)}</span><div class="track"><span style="width:${Math.max(2, Math.round(v / mx * 100))}%"></span></div><b>${brl(v)}</b></div>`;
  const hasAny = exps.length > 0;
  return `<div class="view-head"><h2>Análises</h2>${monthBar(false)}</div>
  ${hasAny ? `
  <div class="card"><h3>Gastos dos últimos 6 meses ${isCasa() ? 'da casa' : ''}</h3>
    <div class="cols">${months.map((mm, i) => `<div class="col ${mm === m ? 'cur' : ''}"><span class="v">${vals[i] ? brl(vals[i]).replace('R$', '').trim() : ''}</span><div class="b" style="height:${Math.round(vals[i] / max * 100)}%"></div><small>${shortMonth(mm)}</small></div>`).join('')}</div>
    <div class="sub">Por vencimento das parcelas. Mês selecionado em destaque.</div></div>
  <div class="grid g2 section">
    <div class="card"><h3>Por categoria em ${esc(monthLabel(m))}</h3>${catList.length ? catList.map(c => bar(c, catMax)).join('') + `<div class="sub" style="margin-top:8px">Total ${brl(catTotal)}</div>` : '<div class="sub">Sem gastos neste mês.</div>'}</div>
    <div class="card"><h3>Por meio de pagamento</h3>${metList.length ? metList.map(c => bar(c, metList[0][1])).join('') : '<div class="sub">Sem gastos neste mês.</div>'}</div>
  </div>` : `<div class="empty">Registre despesas para ver as análises.</div>`}`;
}

/* ---------- render e eventos ---------- */
function render() {
  renderShell();
  const v = { visao: viewVisao, carteira: viewCarteira, despesas: viewDespesas, tarefas: viewTarefas, pendencias: viewPendencias, analises: viewAnalises, config: viewConfig }[ui.page];
  $('#app').innerHTML = (storageOk ? '' : '<div class="banner">Este navegador bloqueou o armazenamento: nada será salvo. Exporte um backup antes de sair.</div>') + v();
}
const closeMenu = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); };
const find = (arr, id) => arr.find(x => x.id === id);
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const a = el.dataset.act, id = el.dataset.id, cur = curMonth();
  if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  switch (a) {
    case 'menu-open': $('#side').classList.add('open'); $('#scrim').classList.add('open'); break;
    case 'menu-close': closeMenu(); break;
    case 'goto': ui.page = el.dataset.page; closeMenu(); render(); scrollTo(0, 0); break;
    case 'goto-alunos': ui.page = 'carteira'; ui.cartTab = 'alunos'; render(); scrollTo(0, 0); break;
    case 'space': ui.space = el.dataset.space; ui.cartTab = 'receb'; ui.expType = 'todas'; ui.expPerson = 'todas'; closeMenu(); render(); break;
    case 'cart-tab': ui.cartTab = el.dataset.tab; render(); break;
    case 'month-prev': ui.month = shiftMonth(cur, -1); render(); break;
    case 'month-next': ui.month = shiftMonth(cur, 1); render(); break;
    case 'month-all': ui.month = ui.month ? '' : todayStr().slice(0, 7); render(); break;
    case 'exp-new': expenseForm(); break;
    case 'exp-edit': expenseForm(find(S.expenses, id)); break;
    case 'exp-parcels': parcelsModal(id); break;
    case 'exp-del': { const e = find(S.expenses, id); if (e && confirm(`Excluir "${e.desc}" e todas as suas parcelas?`)) { S.expenses = S.expenses.filter(x => x.id !== id); save(); render(); toast('Despesa excluída'); } break; }
    case 'tr-new': transferForm(); break;
    case 'tr-suggest': { const b = balance(); if (b.owes) transferForm(b.owes); break; }
    case 'tr-del': if (confirm('Excluir este repasse? A pendência será recalculada.')) { S.transfers = S.transfers.filter(x => x.id !== id); save(); render(); } break;
    case 'w-new': walletForm(); break;
    case 'w-edit': walletForm(find(S.wallet, id)); break;
    case 'w-receive': { const w = find(S.wallet, id); if (w) { w.status = 'recebido'; save(); render(); toast('Marcado como recebido'); } break; }
    case 'w-del': if (confirm('Excluir este lançamento?')) { S.wallet = S.wallet.filter(x => x.id !== id); save(); render(); } break;
    case 'st-new': studentForm(); break;
    case 'st-edit': studentForm(find(S.students, id)); break;
    case 'st-pay': payForm(find(S.students, id)); break;
    case 'st-undo': if (confirm('Desfazer o pagamento deste mês?')) { S.payments = S.payments.filter(p => !(p.studentId === id && p.month === cur)); save(); render(); } break;
    case 'st-del': { const s = find(S.students, id); if (s && confirm(`Excluir ${s.name} e o histórico de pagamentos dele(a)?`)) { S.students = S.students.filter(x => x.id !== id); S.payments = S.payments.filter(p => p.studentId !== id); save(); render(); } break; }
    case 't-new': taskForm(); break;
    case 't-edit': taskForm(find(S.tasks, id)); break;
    case 't-del': if (confirm('Excluir esta tarefa?')) { S.tasks = S.tasks.filter(x => x.id !== id); save(); render(); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), a2 = document.createElement('a');
      a2.href = url; a2.download = `conta-a-dois-backup-${todayStr()}.json`; a2.click(); setTimeout(() => URL.revokeObjectURL(url), 500); break;
    }
    case 'wipe': if (confirm('Apagar TODOS os dados deste navegador? Exporte um backup antes.') && confirm('Tem certeza? Isso não pode ser desfeito.')) { S = freshState(); save(); render(); toast('Dados apagados'); } break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, a = el.dataset && el.dataset.act; if (!a) return;
  if (a === 'month-set') { ui.month = el.value || todayStr().slice(0, 7); render(); }
  else if (a === 'f-type') { ui.expType = el.value; render(); }
  else if (a === 'f-person') { ui.expPerson = el.value; render(); }
  else if (a === 't-filter') { ui.taskFilter = el.value; render(); }
  else if (a === 't-toggle') { const t = find(S.tasks, el.dataset.id); if (t) { t.done = el.checked; save(); render(); } }
  else if (a === 'st-inactive') { ui.showInactive = el.checked; render(); }
  else if (a === 'import') {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.people) || d.people.length !== 2 || !Array.isArray(d.expenses)) throw new Error('formato');
        if (!confirm('Importar este backup substitui os dados atuais. Continuar?')) return;
        S = migrate(d); save(); render(); toast('Backup importado');
      } catch (e) { alert('Arquivo inválido: não parece um backup do Conta a Dois.'); }
    };
    r.readAsText(f); el.value = '';
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target.dataset && ev.target.dataset.form; if (!f) return;
  ev.preventDefault(); const fd = new FormData(ev.target);
  if (f === 'people') {
    const a = String(fd.get('a')).trim(), b = String(fd.get('b')).trim();
    if (!a || !b) return alert('Os dois nomes são obrigatórios.');
    S.people[0].name = a; S.people[1].name = b; save(); render(); toast('Nomes salvos');
  } else if (f === 'cats') {
    const cats = [...new Set(String(fd.get('cats')).split(',').map(s => s.trim()).filter(Boolean))];
    if (!cats.length) return alert('Mantenha ao menos uma categoria.');
    S.categories = cats; save(); render(); toast('Categorias salvas');
  }
});
window.addEventListener('resize', () => document.documentElement.style.setProperty('--stickyH', $('#stickytop').offsetHeight + 'px'));
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { $('#modalRoot').innerHTML = ''; closeMenu(); } });
render();
</script>
</body>
</html>
